apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-platform-admin
  namespace: ai-studio
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-studio
        app.kubernetes.io/component: platform-admin-bootstrap
    spec:
      restartPolicy: Never
      nodeSelector: {kubernetes.io/arch: arm64}
      containers:
        - name: bootstrap-platform-admin
          image: ai-studio-backend:local
          imagePullPolicy: Never
          command: [python, -m, scripts.bootstrap_platform_admin]
          envFrom:
            - configMapRef: {name: ai-studio-config}
            - secretRef: {name: ai-studio-secrets}
